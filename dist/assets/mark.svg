<?xml version="1.0" encoding="UTF-8"?>
<!--
  DeepFocus 图形标 ·「极简线条版」（品牌变体表 02 号）——仅图形，不含文字。
  用途：站点图标 / favicon / 小尺寸场景 / JSON-LD logo 字段。

  ⚠️ 来源说明：本文件是**按位图目视复刻的近似矢量**，不是官方源文件。
     参考图是一张 10 格 logo 变体表（01 标准版 / 02 极简线条版 / 03 渐变版 …），
     本文件只复刻其中第 02 格「极简线条版」的图形部分。
     日后若拿到官方 AI / EPS / SVG 源文件，应直接用官方文件替换本文件。

  几何：viewBox 190×190，等比于参考图（图形包围盒实测 191×190 px）。
  - 外轮廓 = 左直边 + 上直边 + 右侧大圆弧 + 下直边（一个"D"形）；圆弧半径 (101) 大于半高 (95)，
    圆心略偏上 (89, 93)，因此弧线以一个很小的夹角（非相切）接到上下两条直边上——
    这是 02 号格的关键特征。弧线用最小二乘法对原图右边界 163 个采样点做圆拟合得到
    （平均残差 0.26px / 最大 0.73px），不是肉眼估的。
  - 内部 = "F" 字形：上部为闭合描边环（圆角左端 + 斜切右端），下部为一段 S 形笔画
    （竖 → 左转 → 斜下 → 再左转 → 落到竖干 → 触底）。
  颜色：品牌蓝 #4F39F6（深色画布 #07090d 上对比度仅 2.63:1，深色场景请改用
        #8B7CFF 或直接用 currentColor 继承主题，详见 src/components/ui/brand-logo.tsx）。
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 190 190"
  width="190"
  height="190"
  role="img"
  aria-labelledby="dfMarkTitle"
>
  <title id="dfMarkTitle">DeepFocus 图形标</title>
  <!-- 描边式（fill="none" + stroke）：整幅图形没有一处填充，与 02 号格的线条风格一致 -->
  <g
    fill="none"
    stroke="#4F39F6"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- ① 外轮廓："D" 形。左直边 x=4.5、上直边 y=4.5、下直边 y=185.5；
         右侧圆弧圆心 (89, 93)、半径 96.5（居中描边，外缘半径 101 → 最右点 x=190）。
         弧与上下直边的交点：上 x=127.5、下 x=116.5（该处切线夹角约 13°，故不是相切而是"折角"过渡）。 -->
    <path d="M 4.5 185.5 L 4.5 4.5 L 127.5 4.5 A 96.5 96.5 0 0 1 116.5 185.5 Z" />

    <!-- ② "F" 上部：闭合描边环。左端 R24 圆角，右端用一段三次贝塞尔做
         "先近竖直、再大幅左扫"的斜切收尾，环底边即 F 中横（y=83.5）。 -->
    <path
      d="M 32.5 83.5 L 32.5 72.5 A 24 24 0 0 1 56.5 48.5 L 140.5 48.5 C 140.5 62 134 76 120 83.5 Z"
    />

    <!-- ③ "F" 下部：S 形笔画。自中横右侧 (117, 83.5) 垂落，
         R20 圆弧左转 → 约 9.4° 的缓斜直段 → R25.5 圆弧再左转 → 落到竖干 x=35.5 触底。 -->
    <path
      d="M 117 83.5 L 117 100 A 20 20 0 0 1 100.92 119.61 L 56 127 A 25.5 25.5 0 0 0 35.5 152 L 35.5 185.5"
    />
  </g>
</svg>
